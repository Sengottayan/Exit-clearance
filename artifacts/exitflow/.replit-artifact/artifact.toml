kind = "web"
previewPath = "/"
title = "ExitFlow"
version = "1.0.0"
id = "artifacts/exitflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25153

[services.development]
run = "pnpm --filter @workspace/exitflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/exitflow", "run", "build" ]
publicDir = "artifacts/exitflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25153"
BASE_PATH = "/"
